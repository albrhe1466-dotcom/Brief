<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brief Desktop Layer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    pointer-events: none;
    user-select: none;
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* Provider Desktop Layout Overlay Layer (blue=Gemini, white=OpenAI, orange=Claude, tri-color moving=OpenRouter) */
  #blue-layout-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.24s ease;
    border: 3px solid rgba(59, 130, 246, 0.92);
    box-shadow:
      inset 0 0 42px rgba(37, 99, 235, 0.34),
      inset 0 0 110px rgba(37, 99, 235, 0.14);
  }
  #blue-layout-layer.active {
    opacity: 1;
  }
  #blue-layout-layer[data-provider="openai"] {
    border-color: rgba(255, 255, 255, 0.94);
    box-shadow:
      inset 0 0 42px rgba(255, 255, 255, 0.32),
      inset 0 0 110px rgba(255, 255, 255, 0.14);
  }
  #blue-layout-layer[data-provider="anthropic"] {
    border-color: rgba(249, 115, 22, 0.94);
    box-shadow:
      inset 0 0 42px rgba(249, 115, 22, 0.36),
      inset 0 0 110px rgba(234, 88, 12, 0.16);
  }
  #blue-layout-layer[data-provider="openrouter"] {
    border-color: rgba(129, 140, 248, 0.92);
    box-shadow:
      inset 0 0 44px rgba(99, 102, 241, 0.34),
      inset 0 0 110px rgba(79, 70, 229, 0.16);
  }
  .corner {
    position: fixed;
    width: 24px;
    height: 24px;
    border-color: #60a5fa;
    border-style: solid;
    pointer-events: none;
  }
  #blue-layout-layer[data-provider="openai"] .corner { border-color: #ffffff; }
  #blue-layout-layer[data-provider="anthropic"] .corner { border-color: #fb923c; }
  #blue-layout-layer[data-provider="openrouter"] .corner { border-color: #818cf8; }
  .corner.tl { top: 4px; left: 4px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
  .corner.tr { top: 4px; right: 4px; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 4px; left: 4px; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 4px; right: 4px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

  .layer-banner {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    opacity: 0;
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(12, 13, 18, 0.92);
    border: 1.5px solid rgba(96, 165, 250, 0.85);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65), 0 0 18px rgba(59, 130, 246, 0.32);
    color: #f8fafc;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  #blue-layout-layer.controlling .layer-banner {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #blue-layout-layer[data-provider="openai"] .layer-banner { border-color: rgba(255, 255, 255, 0.88); box-shadow: 0 8px 26px rgba(0,0,0,0.65), 0 0 18px rgba(255,255,255,0.28); }
  #blue-layout-layer[data-provider="anthropic"] .layer-banner { border-color: rgba(249, 115, 22, 0.88); box-shadow: 0 8px 26px rgba(0,0,0,0.65), 0 0 18px rgba(249,115,22,0.32); }
  #blue-layout-layer[data-provider="openrouter"] .layer-banner { border-color: rgba(129, 140, 248, 0.88); box-shadow: 0 8px 26px rgba(0,0,0,0.65), 0 0 18px rgba(99,102,241,0.34); }
  .layer-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
  }
  #blue-layout-layer[data-provider="openai"] .layer-dot { background: #ffffff; box-shadow: 0 0 10px #ffffff; }
  #blue-layout-layer[data-provider="anthropic"] .layer-dot { background: #f97316; box-shadow: 0 0 10px #fb923c; }
  #blue-layout-layer[data-provider="openrouter"] .layer-dot { background: #818cf8; box-shadow: 0 0 10px #a5b4fc; }
  @keyframes pulseBlueDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.55; }
  }

  #stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  /* Visible Black Cursor (like Codex's) */
  #cursor-wrap {
    position: fixed;
    left: 0;
    top: 0;
    transform: translate3d(-120px, -120px, 0);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 99999;
  }
  #cursor-wrap.visible {
    opacity: 1;
  }
  /* Hide the fallback SVG arrow whenever the real Windows provider cursor is active (keeps ONLY ONE cursor on screen) */
  #cursor-wrap.native-cursor .cursor-arrow {
    display: none !important;
  }
  .cursor-arrow {
    width: 30px;
    height: 30px;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
  }
  #cursor-wrap.native-cursor .cursor-pill {
    left: 18px;
    top: 18px;
  }
  .cursor-pill {
    position: absolute;
    left: 18px;
    top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(10, 12, 16, 0.94);
    border: 1.5px solid rgba(96, 165, 250, 0.9);
    color: #ffffff;
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.2;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    max-width: 460px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cursor-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 8px #60a5fa;
    flex-shrink: 0;
  }
  .cursor-pill.watching {
    border-color: rgba(52, 211, 153, 0.92) !important;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), 0 0 18px rgba(16, 185, 129, 0.34);
    font-weight: 600;
  }
  .cursor-pill.watching .cursor-dot {
    background: #34d399 !important;
    box-shadow: 0 0 10px #34d399 !important;
    animation: pulseBlueDot 1.35s ease-in-out infinite;
  }
  body[data-provider="openai"] .cursor-pill { border-color: rgba(255, 255, 255, 0.92); }
  body[data-provider="openai"] .cursor-dot { background: #ffffff; box-shadow: 0 0 8px #ffffff; }
  body[data-provider="anthropic"] .cursor-pill { border-color: rgba(249, 115, 22, 0.92); }
  body[data-provider="anthropic"] .cursor-dot { background: #f97316; box-shadow: 0 0 8px #fb923c; }
  body[data-provider="openrouter"] .cursor-pill { border-color: rgba(129, 140, 248, 0.92); }
  body[data-provider="openrouter"] .cursor-dot { background: #818cf8; box-shadow: 0 0 8px #a5b4fc; }
  .ripple {
    position: fixed;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    border: 2.5px solid #60a5fa;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.28), rgba(59, 130, 246, 0.05));
    pointer-events: none;
    animation: ringOut 0.44s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform, opacity;
  }
  body[data-provider="anthropic"] .ripple {
    border-color: #f97316;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.28), rgba(234, 88, 12, 0.05));
  }
  body[data-provider="openai"] .ripple {
    border-color: #ffffff;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.04));
  }
  body[data-provider="openrouter"] .ripple {
    border-color: #818cf8;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.28), rgba(99, 102, 241, 0.06));
  }
  .ripple.right {
    border-color: #f59e0b;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.30), rgba(245, 158, 11, 0.06));
  }
  .ripple.double {
    animation-duration: 0.52s;
    border-width: 3px;
  }
  .cursor-arrow .arrow-gemini,
  .cursor-arrow .arrow-anthropic,
  .cursor-arrow .arrow-openai,
  .cursor-arrow .arrow-openrouter {
    display: none;
  }
  body:not([data-provider]) .cursor-arrow .arrow-gemini,
  body[data-provider="gemini"] .cursor-arrow .arrow-gemini,
  body[data-provider="anthropic"] .cursor-arrow .arrow-anthropic,
  body[data-provider="openai"] .cursor-arrow .arrow-openai,
  body[data-provider="openrouter"] .cursor-arrow .arrow-openrouter {
    display: block;
  }
  @keyframes ringOut {
    0% { transform: scale(0.35); opacity: 0.95; }
    100% { transform: scale(3.6); opacity: 0; }
  }
</style>
</head>
<body>
<div id="blue-layout-layer">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="layer-banner">
    <span class="layer-dot"></span>
    <span id="layer-status-text">Brief · Desktop Control Active · Ctrl+Alt+Q to Stop</span>
  </div>
</div>

<div id="stage">
  <div id="cursor-wrap">
    <!-- Provider fallback cursors (zero particles, shown only if native OS cursor is inactive) -->
    <svg class="cursor-arrow" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gemCurGrad" x1="9" y1="8" x2="39" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2dd4e8"/>
          <stop offset="50%" stop-color="#3882f8"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <linearGradient id="antCurGrad" x1="6" y1="7.5" x2="42" y2="12" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ee341a"/>
          <stop offset="48%" stop-color="#f67016"/>
          <stop offset="100%" stop-color="#f4ae18"/>
        </linearGradient>
      </defs>
      <g class="arrow-gemini">
        <path d="M9.5 8L38.5 20.5L24.5 24.5L20 39.5Z" fill="url(#gemCurGrad)" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round"/>
        <path d="M9.5 8L38.5 20.5L24.5 24.5L20 39.5Z" fill="url(#gemCurGrad)"/>
        <path d="M22.8 16.2C23.4 20.2 24.2 21 28.0 21.8C24.2 22.4 23.4 23.2 22.8 27.4C22.2 23.2 21.4 22.4 17.6 21.8C21.4 21 22.2 20.2 22.8 16.2Z" fill="#ffffff"/>
      </g>
      <g class="arrow-anthropic">
        <path d="M6 7.5L42.5 7.5L23.5 42.5L22 22Z" fill="url(#antCurGrad)" stroke="#ee3a1a" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="28.2" cy="16.5" r="2.0" fill="#ffffff"/>
        <path d="M28.2 10.6V22.4M22.3 16.5H34.1M24.0 12.3L32.4 20.7M32.4 12.3L24.0 20.7M25.6 10.9L30.8 22.1M22.7 13.9L33.7 19.1" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="arrow-openai">
        <path d="M6 6L42 17L17 42Z" fill="#6c9e95" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round"/>
        <path d="M6 6L42 17L17 42Z" fill="#6c9e95"/>
        <g transform="translate(21 21)" stroke="#ffffff" stroke-width="1.4" fill="none">
          <circle cx="0" cy="-3.4" r="3.1"/>
          <circle cx="2.95" cy="-1.7" r="3.1"/>
          <circle cx="2.95" cy="1.7" r="3.1"/>
          <circle cx="0" cy="3.4" r="3.1"/>
          <circle cx="-2.95" cy="1.7" r="3.1"/>
          <circle cx="-2.95" cy="-1.7" r="3.1"/>
        </g>
      </g>
      <g class="arrow-openrouter">
        <path d="M9.5 5.5L40.5 31L21.5 35.5L10 42.5Z" fill="#040406" stroke="rgba(220,228,240,0.68)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="16.4" cy="24.2" r="3.3" stroke="#ffffff" stroke-width="2.1"/>
        <path d="M21.0 27.6V20.8H23.4C24.9 20.8 25.5 21.6 25.5 22.6C25.5 23.7 24.7 24.4 23.2 24.4H21.4L25.4 27.6" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="cursor-pill" id="cursor-pill">
      <span class="cursor-dot"></span>
      <span id="cursor-label">Brief</span>
      <span id="cursor-typing-text" style="display:none; font-family: ui-monospace, Consolas, monospace; color: #93c5fd; margin-left: 4px; font-weight: 600;"></span>
    </div>
  </div>
</div>

<script>
  const layer = document.getElementById('blue-layout-layer');
  const layerText = document.getElementById('layer-status-text');
  const wrap = document.getElementById('cursor-wrap');
  const label = document.getElementById('cursor-label');
  const stage = document.getElementById('stage');

  let curX = 240;
  let curY = 240;
  let animRaf = null;
  let isAnimating = false;
  let cursorHideTimer = null;
  let isWorkActive = false;

  function renderPos(x, y) {
    curX = x;
    curY = y;
    wrap.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
  }

  function animateTo(tx, ty, duration) {
    if (animRaf) cancelAnimationFrame(animRaf);
    isAnimating = true;
    const sx = curX;
    const sy = curY;
    const d = Math.max(24, Number(duration) || 200);
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / d);
      const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const nx = sx + (tx - sx) * ease;
      const ny = sy + (ty - sy) * ease;
      renderPos(nx, ny);
      if (t < 1) {
        animRaf = requestAnimationFrame(step);
      } else {
        animRaf = null;
        isAnimating = false;
      }
    }
    animRaf = requestAnimationFrame(step);
  }

  function spawnRipple(x, y, button, count) {
    const el = document.createElement('div');
    el.className = 'ripple' + (button === 'right' ? ' right' : '') + (count >= 2 ? ' double' : '');
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 580);
    if (count >= 2) {
      setTimeout(() => {
        const el2 = document.createElement('div');
        el2.className = 'ripple double';
        el2.style.left = Math.round(x) + 'px';
        el2.style.top = Math.round(y) + 'px';
        stage.appendChild(el2);
        setTimeout(() => el2.remove(), 580);
      }, 95);
    }
  }

  if (window.overlayAPI) {
    function applyOverlayProvider(rawProv) {
      const p = String(rawProv || '').toLowerCase();
      const norm = (p === 'claude' || p === 'anthropic') ? 'anthropic'
        : (p === 'openai' || p === 'chatgpt' || p === 'codex') ? 'openai'
        : (p === 'openrouter' ? 'openrouter' : (p ? 'gemini' : ''));
      if (!norm) return;
      layer.setAttribute('data-provider', norm);
      document.body.setAttribute('data-provider', norm);
    }

    window.overlayAPI.onStatus((s) => {
      if (!s) return;
      if (s.provider) applyOverlayProvider(s.provider);
      isWorkActive = !!s.running && s.mode === 'work';
      layer.classList.toggle('active', isWorkActive);
      // Keep the banner steady once while working (never blink in/out between thinking and acting steps).
      layer.classList.toggle('controlling', isWorkActive);
      if (typeof s.nativeCursor === 'boolean') {
        wrap.classList.toggle('native-cursor', s.nativeCursor);
      }
      const pillEl = document.getElementById('cursor-pill');
      if (pillEl) pillEl.classList.toggle('watching', s.state === 'watching');
      if (isWorkActive && s.stepText) {
        const nextBanner = (s.state === 'watching' ? 'Brief Watching · ' : 'Brief Working · ') + s.stepText.slice(0, 58) + ' · Ctrl+Alt+Q to Stop';
        if (layerText.textContent !== nextBanner) layerText.textContent = nextBanner;
        const nextLbl = s.stepText.slice(0, 52);
        if (label.textContent !== nextLbl) label.textContent = nextLbl;
      }
      if (!s.running) {
        layer.classList.remove('controlling');
        wrap.classList.remove('visible');
        wrap.classList.remove('native-cursor');
        if (pillEl) pillEl.classList.remove('watching');
      }
    });

    window.overlayAPI.onCursor((evt) => {
      if (!evt) return;
      if (evt.provider) applyOverlayProvider(evt.provider);
      clearTimeout(cursorHideTimer);
      if (evt.kind === 'hide') {
        isWorkActive = false;
        isAnimating = false;
        if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }
        layer.classList.remove('active');
        layer.classList.remove('controlling');
        wrap.classList.remove('visible');
        wrap.classList.remove('native-cursor');
        return;
      }
      if (typeof evt.nativeCursor === 'boolean') {
        wrap.classList.toggle('native-cursor', evt.nativeCursor);
      }
      layer.classList.add('active');
      const pillEl = document.getElementById('cursor-pill');
      if (pillEl) pillEl.classList.toggle('watching', evt.kind === 'watch');
      if (['move', 'click', 'drag', 'type', 'scroll', 'watch'].includes(evt.kind)) {
        layer.classList.add('controlling');
      }
      wrap.classList.add('visible');
      if (evt.label) label.textContent = evt.label;
      if (evt.kind === 'watch' && evt.label) {
        layerText.textContent = 'Brief Watching · ' + String(evt.label).slice(0, 58) + ' · Ctrl+Alt+Q to Stop';
      }
      if (typeof evt.x === 'number' && typeof evt.y === 'number') {
        if (evt.kind === 'move' || evt.kind === 'drag') {
          animateTo(evt.x, evt.y, evt.ms || 200);
        } else if (!isAnimating) {
          renderPos(evt.x, evt.y);
        }
      }
      if (evt.kind === 'click') {
        spawnRipple(typeof evt.x === 'number' ? evt.x : curX, typeof evt.y === 'number' ? evt.y : curY, evt.button || 'left', evt.count || 1);
      }
      const typingEl = document.getElementById('cursor-typing-text');
      if (evt.kind === 'type') {
        if (evt.text) {
          label.textContent = evt.label || 'Typing:';
          if (typingEl) {
            typingEl.style.display = 'inline';
            typingEl.textContent = evt.text;
          }
        } else {
          label.textContent = evt.label ? (evt.label.startsWith('Typing') ? evt.label : 'Typing: ' + evt.label) : 'Typing…';
          if (typingEl) typingEl.style.display = 'none';
        }
      } else if (evt.kind !== 'layer-only') {
        if (typingEl) typingEl.style.display = 'none';
      }
      if (evt.kind === 'scroll') {
        label.textContent = 'Scrolling ' + (evt.direction || 'down');
      }
      if (!isWorkActive) {
        cursorHideTimer = setTimeout(() => {
          if (!isWorkActive) wrap.classList.remove('visible');
        }, 6000);
      }
    });
  }
</script>
</body>
</html>
