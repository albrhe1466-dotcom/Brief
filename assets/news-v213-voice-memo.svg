  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="220" cy="130" r="240" fill="#3b82f6" opacity="0.07"/>
  <circle cx="1050" cy="620" r="270" fill="#d9693f" opacity="0.08"/>

  <!-- Header Strip -->
  <text x="64" y="66" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="800">Voice Memo Waveform &amp; Instant Speech-to-Text</text>
  <text x="64" y="98" fill="#9ca3af" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">Brief v2.1.3-beta · Crystal-clear zero-mistake voice memo input next to Send across all 4 LLMs</text>

  <!-- 4 LLM Provider Pills -->
  <g transform="translate(64, 120)" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">
    <rect x="0" y="0" width="136" height="34" rx="17" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="5" fill="#60a5fa"/>
    <text x="36" y="22" fill="#dbeafe">Gemini 4</text>

    <rect x="150" y="0" width="136" height="34" rx="17" fill="#1f2024" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="172" cy="17" r="5" fill="#ffffff"/>
    <text x="186" y="22" fill="#ffffff">OpenAI GPT-6</text>

    <rect x="300" y="0" width="142" height="34" rx="17" fill="#2b1912" stroke="#d9693f" stroke-width="1.5"/>
    <circle cx="322" cy="17" r="5" fill="#d9693f"/>
    <text x="336" y="22" fill="#fed7aa">Claude 5.5</text>

    <rect x="456" y="0" width="154" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="478" cy="17" r="5" fill="#818cf8"/>
    <text x="492" y="22" fill="#e0e7ff">OpenRouter</text>
