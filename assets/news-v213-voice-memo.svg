    <g transform="translate(996, 141)">
      <rect x="0" y="0" width="70" height="44" rx="22" fill="#1e2433" stroke="#475569" stroke-width="1.5"/>
      <rect x="17" y="11" width="7" height="13" rx="3.5" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <path d="M12.5 19a8 8 0 0 0 16 0" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <line x1="20.5" y1="27" x2="20.5" y2="32" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="12" x2="40" y2="32" stroke="#475569" stroke-width="1.4"/>
      <polyline points="48,25 54,19 60,25" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
