      <rect x="17" y="11" width="7" height="13" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M12.5 19a8 8 0 0 0 16 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="20.5" y1="27" x2="20.5" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="12" x2="40" y2="32" stroke="#fca5a5" stroke-opacity="0.55" stroke-width="1.4"/>
      <polyline points="48,25 54,19 60,25" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

