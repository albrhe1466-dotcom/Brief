    <rect x="28" y="144" width="38" height="38" rx="12" fill="#1f2432" stroke="#333b4f"/>
    <text x="47" y="169" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="20">+</text>

    <rect x="78" y="146" width="256" height="34" rx="17" fill="#11261d" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="206" y="168" text-anchor="middle" fill="#86efac" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">✓ Transcribed cleanly · 0 mistakes</text>

