    <text x="902" y="99" text-anchor="middle" fill="#d1d5db" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="600">✕ Cancel</text>

    <rect x="962" y="74" width="142" height="40" rx="20" fill="#2563eb" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="1033" y="99" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">✓ Convert Text</text>

    <!-- Bottom Controls Row -->
    <rect x="28" y="150" width="38" height="38" rx="12" fill="#1f2432" stroke="#333b4f"/>
    <text x="47" y="175" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="20">+</text>

    <rect x="78" y="152" width="320" height="34" rx="17" fill="#1b202e" stroke="#30394f"/>
    <text x="238" y="174" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">All 4 LLMs · PC Mic Input Selector (Headphones / Aux / USB)</text>

