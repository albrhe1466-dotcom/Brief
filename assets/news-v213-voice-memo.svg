      <rect x="96" y="-9" width="6" height="18" rx="3"/>
      <rect x="112" y="-22" width="6" height="44" rx="3"/>
      <rect x="128" y="-29" width="6" height="58" rx="3"/>
      <rect x="144" y="-17" width="6" height="34" rx="3"/>
      <rect x="160" y="-11" width="6" height="22" rx="3"/>
      <rect x="176" y="-25" width="6" height="50" rx="3"/>
      <rect x="192" y="-19" width="6" height="38" rx="3"/>
      <rect x="208" y="-8" width="6" height="16" rx="3"/>
      <rect x="224" y="-21" width="6" height="42" rx="3"/>
      <rect x="240" y="-28" width="6" height="56" rx="3"/>
      <rect x="256" y="-15" width="6" height="30" rx="3"/>
      <rect x="272" y="-23" width="6" height="46" rx="3"/>
      <rect x="288" y="-12" width="6" height="24" rx="3"/>
      <rect x="304" y="-26" width="6" height="52" rx="3"/>
      <rect x="320" y="-18" width="6" height="36" rx="3"/>
      <rect x="336" y="-10" width="6" height="20" rx="3"/>
      <rect x="352" y="-22" width="6" height="44" rx="3"/>
      <rect x="368" y="-14" width="6" height="28" rx="3"/>
      <rect x="384" y="-20" width="6" height="40" rx="3"/>
      <rect x="400" y="-11" width="6" height="22" rx="3"/>
      <rect x="416" y="-16" width="6" height="32" rx="3"/>
      <rect x="432" y="-8" width="6" height="16" rx="3"/>
