  <!-- STEP 1: LIVE RECORDING MEMO BAR -->
  <g transform="translate(64, 184)">
    <text x="4" y="20" fill="#93c5fd" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">1 · TAP MICROPHONE NEXT TO SEND → COMPOSER TRANSFORMS INTO LIVE VOICE MEMO</text>
    <rect x="0" y="34" width="1152" height="196" rx="26" fill="url(#cardGlow)" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>

    <!-- Live Memo Waveform Strip inside Composer -->
    <rect x="28" y="58" width="1096" height="72" rx="18" fill="#0d1018" stroke="#283147" stroke-width="1.4"/>

    <!-- Recording Dot & Timer -->
    <circle cx="58" cy="94" r="9" fill="#ef4444" opacity="0.28"/>
    <circle cx="58" cy="94" r="5.5" fill="#ef4444"/>
    <text x="76" y="99" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700">Memo · 0:07</text>
    <text x="192" y="99" fill="#93c5fd" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Listening clearly…</text>

