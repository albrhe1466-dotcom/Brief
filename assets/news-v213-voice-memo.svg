    <g transform="translate(362, 94)" fill="url(#waveGrad)">
      <rect x="0" y="-8" width="6" height="16" rx="3"/>
      <rect x="16" y="-16" width="6" height="32" rx="3"/>
      <rect x="32" y="-24" width="6" height="48" rx="3"/>
      <rect x="48" y="-13" width="6" height="26" rx="3"/>
      <rect x="64" y="-27" width="6" height="54" rx="3"/>
