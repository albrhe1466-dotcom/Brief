<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      /* White on dark backgrounds, adapt via CSS on the img element */
    </style>
  </defs>
  <!-- OpenAI "rosette" / bloom logo - 6 overlapping teardrop petals -->
  <!-- Center point: 100,100; each petal rotated 60 degrees -->
  <g transform="translate(100,100)" fill="white" fill-rule="evenodd">
    <!-- Petal 1: pointing up -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(0)"/>
    <!-- Petal 2: rotated 60 -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(60)"/>
    <!-- Petal 3: rotated 120 -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(120)"/>
    <!-- Petal 4: rotated 180 -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(180)"/>
    <!-- Petal 5: rotated 240 -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(240)"/>
    <!-- Petal 6: rotated 300 -->
    <ellipse rx="22" ry="44" cx="0" cy="-28" transform="rotate(300)"/>
    <!-- Center circle to create the interlocking effect -->
    <circle r="18" fill="none" stroke="white" stroke-width="6"/>
  </g>
</svg>
