<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d13"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg2)"/>
  <circle cx="1020" cy="140" r="240" fill="#3b82f6" opacity="0.09"/>

  <text x="64" y="66" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="800">Live Web Search Website Logos &amp; Expandable Sources</text>
  <text x="64" y="98" fill="#9ca3af" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">Real website favicons on the right while searching + ▾ dropdown showing queries, visited pages &amp; blue Open Link button</text>

  <!-- Main Assistant Search Card -->
  <rect x="64" y="134" width="1152" height="566" rx="24" fill="#131722" stroke="#283248" stroke-width="1.6"/>

  <!-- Top Search Status Row with Stacked Website Logos on Right + Down Arrow -->
  <rect x="96" y="166" width="1088" height="66" rx="16" fill="#0d1018" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="128" cy="199" r="6" fill="#3b82f6"/>
  <text x="148" y="205" fill="#e5e7eb" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">Searching the web for “latest solar perovskite efficiency 2026”…</text>

  <!-- Right-Aligned Real Website Logo Stack + Chevron Arrow -->
  <g transform="translate(888, 179)">
    <rect x="0" y="0" width="274" height="40" rx="20" fill="#161e2e" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.3"/>
    <!-- Stacked Circular Site Logos (No Emojis!) -->
    <circle cx="26" cy="20" r="13" fill="#de5833" stroke="#0d1018" stroke-width="2"/>
    <text x="26" y="24.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="800">D</text>

    <circle cx="46" cy="20" r="13" fill="#ffffff" stroke="#0d1018" stroke-width="2"/>
    <text x="46" y="24.5" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="12" font-weight="800">W</text>

    <circle cx="66" cy="20" r="13" fill="#1f2937" stroke="#0d1018" stroke-width="2"/>
    <text x="66" y="24.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="800">GH</text>

    <circle cx="86" cy="20" r="13" fill="#1d4ed8" stroke="#0d1018" stroke-width="2"/>
    <text x="86" y="24.5" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="12" font-weight="800">N</text>

    <text x="112" y="25" fill="#bfdbfe" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">4 websites</text>
    <!-- Downward Chevron Arrow -->
    <circle cx="246" cy="20" r="13" fill="#2563eb" opacity="0.28"/>
    <polyline points="240,17 246,23 252,17" fill="none" stroke="#93c5fd" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Expanded Dropdown Drawer Below -->
  <rect x="96" y="248" width="1088" height="420" rx="18" fill="#0e121b" stroke="#263044" stroke-width="1.4"/>

  <!-- Query Pill -->
  <text x="124" y="284" fill="#93c5fd" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.7">WHAT BRIEF SEARCHED &amp; WHERE IT SEARCHED FROM</text>
  <rect x="124" y="296" width="540" height="36" rx="18" fill="#172033" stroke="#334155"/>
  <circle cx="146" cy="314" r="10" fill="#de5833"/>
  <text x="146" y="318" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9.5" font-weight="800">D</text>
  <text x="166" y="319" fill="#e2e8f0" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="600">duckduckgo.com · “latest solar perovskite efficiency 2026”</text>

  <!-- Link Row 1 -->
  <g transform="translate(124, 352)">
    <rect x="0" y="0" width="1032" height="86" rx="14" fill="#151b28" stroke="#2c3852"/>
    <rect x="18" y="21" width="44" height="44" rx="12" fill="#1d4ed8"/>
    <text x="40" y="50" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22" font-weight="700">N</text>
    <text x="78" y="36" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Tandem Perovskite-Silicon Solar Cells Reach New 2026 Efficiency Record</text>
    <rect x="656" y="19" width="68" height="22" rx="11" fill="#064e3b" stroke="#10b981"/>
    <text x="690" y="34" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11" font-weight="700">Visited</text>
    <text x="78" y="61" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="13">nature.com · https://www.nature.com/articles/s41560-026-perovskite</text>
    <!-- Crisp Blue Open Link Button -->
    <rect x="910" y="23" width="102" height="40" rx="12" fill="#2563eb" stroke="#60a5fa" stroke-width="1.2"/>
    <path d="M934 48l10-10M937 38h7v7" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="954" y="48" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">Open</text>
  </g>

  <!-- Link Row 2 -->
  <g transform="translate(124, 452)">
    <rect x="0" y="0" width="1032" height="86" rx="14" fill="#151b28" stroke="#2c3852"/>
    <rect x="18" y="21" width="44" height="44" rx="12" fill="#ffffff"/>
    <text x="40" y="50" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="22" font-weight="700">W</text>
    <text x="78" y="36" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Perovskite solar cell — Wikipedia</text>
    <text x="78" y="61" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="13">en.wikipedia.org · https://en.wikipedia.org/wiki/Perovskite_solar_cell</text>
    <rect x="910" y="23" width="102" height="40" rx="12" fill="#2563eb" stroke="#60a5fa" stroke-width="1.2"/>
    <path d="M934 48l10-10M937 38h7v7" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="954" y="48" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">Open</text>
  </g>

  <!-- Link Row 3 -->
  <g transform="translate(124, 552)">
    <rect x="0" y="0" width="1032" height="86" rx="14" fill="#151b28" stroke="#2c3852"/>
    <rect x="18" y="21" width="44" height="44" rx="12" fill="#1f2937" stroke="#475569"/>
    <text x="40" y="50" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">GH</text>
    <text x="78" y="36" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">NREL / Solar-Efficiency-Dataset-2026 · GitHub</text>
    <text x="78" y="61" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="13">github.com · https://github.com/NREL/solar-efficiency-2026</text>
    <rect x="910" y="23" width="102" height="40" rx="12" fill="#2563eb" stroke="#60a5fa" stroke-width="1.2"/>
    <path d="M934 48l10-10M937 38h7v7" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="954" y="48" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">Open</text>
  </g>
</svg>
