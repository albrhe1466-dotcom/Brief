<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <rect width="1280" height="760" fill="#1b1a19"/>
  <circle cx="640" cy="360" r="320" fill="#d9693f" opacity="0.06"/>

  <text x="64" y="66" fill="#f5f2eb" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="800">Claude 4-Stage #d9693f Motion (1.2× Faster) &amp; Welcome-Only Clawd</text>
  <text x="64" y="98" fill="#b7b1a6" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">Starburst → 3 Pure Balls Orbiting (1.2× speed, zero rings) → Aligned Soft Pulse → Bouncing Wave + Clean Status Sync</text>

  <!-- 4 Motion Stage Cards -->
  <g transform="translate(64, 146)" font-family="Inter, Segoe UI, system-ui, sans-serif">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="264" height="270" rx="22" fill="#242220" stroke="#d9693f" stroke-opacity="0.38" stroke-width="1.5"/>
    <text x="24" y="36" fill="#fdba74" font-size="13" font-weight="700">STAGE 1 · SPARK</text>
    <g transform="translate(132, 134)" stroke="#d9693f" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-44" x2="0" y2="44"/>
      <line x1="-44" y1="0" x2="44" y2="0"/>
      <line x1="-31" y1="-31" x2="31" y2="31"/>
      <line x1="31" y1="-31" x2="-31" y2="31"/>
      <line x1="-18" y1="-40" x2="18" y2="40"/>
      <line x1="-40" y1="-18" x2="40" y2="18"/>
    </g>
    <text x="132" y="232" text-anchor="middle" fill="#e7e2d8" font-size="14.5" font-weight="600">Initial Starburst</text>
    <text x="132" y="252" text-anchor="middle" fill="#9c968b" font-size="12">Morphs petals into 3 balls</text>

    <!-- Stage 2 -->
    <rect x="296" y="0" width="264" height="270" rx="22" fill="#242220" stroke="#d9693f" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="320" y="36" fill="#fdba74" font-size="13" font-weight="700">STAGE 2 · 1.2× 3D ORBIT</text>
    <!-- Pure 3 #d9693f balls — ZERO rings, ZERO atom -->
    <circle cx="386" cy="116" r="10.5" fill="#d9693f" opacity="0.98"/>
    <circle cx="468" cy="148" r="8.2" fill="#d9693f" opacity="0.78"/>
    <circle cx="418" cy="166" r="6.5" fill="#d9693f" opacity="0.62"/>
    <text x="428" y="232" text-anchor="middle" fill="#e7e2d8" font-size="14.5" font-weight="600">3 Pure Orbiting Balls</text>
    <text x="428" y="252" text-anchor="middle" fill="#9c968b" font-size="12">1.2× faster · No rings</text>

    <!-- Stage 3 -->
    <rect x="592" y="0" width="264" height="270" rx="22" fill="#242220" stroke="#d9693f" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="616" y="36" fill="#fdba74" font-size="13" font-weight="700">STAGE 3 · ALIGN &amp; PULSE</text>
    <circle cx="674" cy="136" r="19" fill="#d9693f" opacity="1"/>
    <circle cx="724" cy="136" r="13.5" fill="#d9693f" opacity="0.86"/>
    <circle cx="774" cy="136" r="9.5" fill="#d9693f" opacity="0.74"/>
    <text x="724" y="232" text-anchor="middle" fill="#e7e2d8" font-size="14.5" font-weight="600">Big ↔ Small Wave Pulse</text>
    <text x="724" y="252" text-anchor="middle" fill="#9c968b" font-size="12">Balls align smoothly</text>

    <!-- Stage 4 -->
    <rect x="888" y="0" width="264" height="270" rx="22" fill="#242220" stroke="#d9693f" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="912" y="36" fill="#fdba74" font-size="13" font-weight="700">STAGE 4 · WAVE JUMP</text>
    <circle cx="970" cy="150" r="15.5" fill="#d9693f"/>
    <circle cx="1020" cy="112" r="15.5" fill="#d9693f"/>
    <circle cx="1070" cy="144" r="15.5" fill="#d9693f"/>
    <text x="1020" y="232" text-anchor="middle" fill="#e7e2d8" font-size="14.5" font-weight="600">Jumping Loading Wave</text>
    <text x="1020" y="252" text-anchor="middle" fill="#9c968b" font-size="12">Clean finish · Zero stuck state</text>
  </g>

  <!-- Bottom Banner: Clawd Welcome-Only + Redirect Memory + Status Fix -->
  <g transform="translate(64, 452)" font-family="Inter, Segoe UI, system-ui, sans-serif">
    <rect x="0" y="0" width="1152" height="240" rx="24" fill="#23211f" stroke="#3c3732" stroke-width="1.5"/>
    <text x="36" y="48" fill="#ffffff" font-size="20" font-weight="700">Clean Brief Work Main-Menu Clawd · Fixed Model-Switch Status · Smart Redirect Memory</text>
    <text x="36" y="88" fill="#d6d1c7" font-size="15.5">• Clawd (coding &amp; playing soccer) perches ONLY on the Brief Work main menu — and steps aside cleanly as soon as you ask a question.</text>
    <text x="36" y="124" fill="#d6d1c7" font-size="15.5">• Fixed “Checking…” &amp; “Ready” indicator bugs when switching between Gemini, OpenAI, Claude &amp; OpenRouter.</text>
    <text x="36" y="160" fill="#d6d1c7" font-size="15.5">• Calm Redirect Memory: say “No, open X instead of Y” and Brief locks onto X cleanly without confusion or repeating Y.</text>
    <rect x="36" y="184" width="410" height="34" rx="17" fill="#32231b" stroke="#d9693f"/>
    <text x="241" y="206" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="700">Active across Windows · Linux · Android v2.1.3-beta</text>
  </g>
</svg>
